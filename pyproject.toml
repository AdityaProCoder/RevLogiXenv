[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revlogixenv"
version = "0.2.0"
description = "RevLogiXenv: OpenEnv-compatible reverse-logistics RL environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "openai>=1.0",
    "numpy>=1.20",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "server.app:main"
run-server = "run_server:main"
baseline = "run_baseline:main"

[tool.setuptools]
include-package-data = true
packages = ["RevLogiXenv_v0", "server"]
py-modules = ["run_baseline", "run_server"]
